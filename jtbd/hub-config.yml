title: "Skupper Documentation"
subtitle: "Red Hat build of Skupper 2"
categories:
  - name: "Discover"
    description: "Understand Skupper's L7 application networking model"
    assemblies:
      - overview-assembly-skupper-overview.adoc
      - overview-assembly-overview-connectivity.adoc

  - name: "Plan"
    description: "Design topology, security model, and infrastructure before installation"
    assemblies:
      - overview-assembly-skupper-routing.adoc
      - overview-assembly-overview-load-balancing.adoc
      - overview-assembly-kube-resources.adoc

  - name: "Migrate"
    description: "Transition from Skupper v1 to v2"
    assemblies:
      - overview-assembly-migrating.adoc

  - name: "Administer"
    description: "Manage site life cycles and cluster permissions"
    assemblies:
      - assembly-kube-creating-sites.adoc
      - assembly-system-creating-sites.adoc

  - name: "Configure"
    description: "Establish inter-site links and make workloads reachable"
    assemblies:
      - assembly-kube-linking-sites.adoc
      - assembly-system-linking-sites.adoc
      - assembly-kube-exposing-services.adoc
      - assembly-system-exposing-services.adoc

  - name: "Secure"
    description: "Implement encryption, access controls, and certificate management"
    assemblies:
      - overview-assembly-skupper-security.adoc
      - kube-yaml-assembly-kube-yaml-custom-certs.adoc

  - name: "Observe"
    description: "Monitor network health and track application traffic"
    assemblies:
      - console-assembly-observer-config.adoc

  - name: "Troubleshoot"
    description: "Diagnose and resolve connectivity failures and deployment issues"
    assemblies:
      - troubleshooting-assembly-troubleshooting.adoc

  - name: "Reference"
    description: "CLI syntax, resource schemas, and API definitions"
    assemblies:
      - kube-cli-assembly-kube-cli.adoc
      - kube-yaml-assembly-kube-yaml.adoc
      - system-cli-assembly-system-cli.adoc
      - system-yaml-assembly-system-yaml.adoc
